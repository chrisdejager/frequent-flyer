# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
services:
    # Vervangt de standaard logger van FrameworkBundle zodat waarschuwingen
    # (warning+) naar stderr schrijven. Zonder dit override staat de drempelwaarde
    # op ERROR, waardoor $logger->warning(...) stilletjes niets doet.
    logger:
        class: Symfony\Component\HttpKernel\Log\Logger
        arguments:
            $minLevel: 'warning'
            $output: 'php://stderr'

    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    App\Infrastructure\Source\BrightDataFlightSource:
        arguments:
            $apiToken: '%env(BRIGHTDATA_TOKEN)%'
            $zone: '%env(BRIGHTDATA_ZONE)%'
            # Expliciet, ook al autowiret Symfony dit: zonder deze regel verdwijnt
            # de logger stil zodra iemand dit blok met een positional argument uitbreidt.
            $logger: '@logger'

    App\Domain\Port\FlightPriceSource: '@App\Infrastructure\Source\BrightDataFlightSource'
    App\Domain\Port\PriceHistory: '@App\Infrastructure\Persistence\NullPriceHistory'

    App\Infrastructure\Source\ApifyTrainPriceSource:
        arguments:
            $cache: '@cache.app'
            $apiToken: '%env(APIFY_TOKEN)%'
            # Expliciet, ook al autowiret Symfony dit: zonder deze regel verdwijnt
            # de logger stil zodra iemand dit blok met een positional argument uitbreidt.
            $logger: '@logger'

    App\Domain\Port\TrainPriceSource: '@App\Infrastructure\Source\ApifyTrainPriceSource'

    App\Domain\Pricing\FareUpgradeRates:
        factory: ['App\Domain\Pricing\FareUpgradeRates', 'fromConfig']
        arguments:
            $raw:
                AY: '%env(float:FARE_UPGRADE_AY)%'
                KL: '%env(float:FARE_UPGRADE_KL)%'

when@test:
    services:
        App\Domain\Port\FlightPriceSource:
            alias: App\Infrastructure\Source\BrightDataFlightSource
            public: true
        App\Domain\Port\TrainPriceSource:
            alias: App\Infrastructure\Source\ApifyTrainPriceSource
            public: true
