# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
services:
    # Replaces the FrameworkBundle default logger so that warnings (warning+)
    # go to stderr. Without this override the threshold is ERROR, and
    # $logger->warning(...) silently does nothing.
    logger:
        class: Symfony\Component\HttpKernel\Log\Logger
        arguments:
            $minLevel: 'warning'
            $output: 'php://stderr'

    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    App\Infrastructure\Source\IgnavFlightSource:
        arguments:
            $apiKey: '%env(IGNAV_API_KEY)%'
            # Explicit, even though Symfony autowires it: without this line the logger
            # silently disappears as soon as someone adds a positional argument here.
            $logger: '@logger'

    App\Domain\Port\FlightPriceSource: '@App\Infrastructure\Source\IgnavFlightSource'
    App\Domain\Port\PriceHistory: '@App\Infrastructure\Persistence\NullPriceHistory'

    App\Infrastructure\Source\IgnavBookingLinkSource:
        arguments:
            $cache: '@cache.app'
            $apiKey: '%env(IGNAV_API_KEY)%'
            $logger: '@logger'

    App\Domain\Port\BookingLinkSource: '@App\Infrastructure\Source\IgnavBookingLinkSource'

when@test:
    services:
        App\Domain\Port\FlightPriceSource:
            alias: App\Infrastructure\Source\IgnavFlightSource
            public: true
        App\Domain\Port\BookingLinkSource:
            alias: App\Infrastructure\Source\IgnavBookingLinkSource
            public: true
        # Exposed for LoggerConfigurationTest: proves that the logger: block in the
        # production definition keeps the threshold at 'warning'.
        test.logger:
            alias: logger
            public: true
