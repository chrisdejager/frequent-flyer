services:
  php:
    build: ./docker/php
    volumes:
      - ./api:/app
    working_dir: /app

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./api:/app
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
      - node

  node:
    image: node:22-alpine
    volumes:
      - ./web:/app
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
