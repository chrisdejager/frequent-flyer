services:
  php:
    build:
      context: ./docker/php
      target: base
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      - ./api:/app
    working_dir: /app

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./api:/app
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
      - node

  node:
    image: node:22-alpine
    # As the host user, like php: node_modules, dist and .vite stay yours.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      # npm keeps its cache in $HOME, and an arbitrary uid has no home here.
      HOME: /tmp
    volumes:
      - ./web:/app
    working_dir: /app
    command: npm run dev -- --host 0.0.0.0
